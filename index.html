  function decode(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  var frame   = document.getElementById("frame");
  var loading = document.getElementById("loading");

  var currentRoom = null;
  var currentEj   = null;

  // Estado compartido del taller (claves miCasaEnExcel_*).
  // Lo guardamos en el localStorage del padre si podemos; si no, en memoria.
  var sharedState = {};
  function loadSharedStateFromStorage(){
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf("miCasaEnExcel") === 0){
          sharedState[k] = localStorage.getItem(k);
        }
      }
    } catch(_){}
  }
  loadSharedStateFromStorage();

  function parseHash(){
    var h = (location.hash || "").replace(/^#/, "");
    if (!h) return { room: "vestibulo", ej: null };
    var qIdx = h.indexOf("?");
    var room  = qIdx >= 0 ? h.substring(0, qIdx) : h;
    var query = qIdx >= 0 ? h.substring(qIdx + 1) : "";
    if (!PAGES[room]) return { room: "vestibulo", ej: null };
    var ej = null;
    if (query){
      var pairs = query.split("&");
      for (var i = 0; i < pairs.length; i++){
        var kv = pairs[i].split("=");
        if (kv[0] === "ej") ej = decodeURIComponent(kv[1] || "");
      }
    }
    return { room: room, ej: ej };
  }

  function loadRoom(room, ej){
    loading.classList.add("show");
    // Refrescar estado por si algo cambio en localStorage (otra pestaña, etc.)
    loadSharedStateFromStorage();
    var html = decode(PAGES[room]);
    // Inyectamos ?ej=N y el estado completo del taller como globals,
    // ANTES de que se ejecute el bridge.
    var ejLiteral    = (ej === null || ej === undefined) ? "null" : JSON.stringify(String(ej));
    var stateLiteral = JSON.stringify(sharedState);
    var inject =
      '<script>' +
      'window.__INITIAL_EJ=' + ejLiteral + ';' +
      'window.__INITIAL_STATE=' + stateLiteral + ';' +
      '<\/script>';
    html = html.replace(
      '<meta charset="UTF-8">',
      '<meta charset="UTF-8">' + inject
    );
    frame.srcdoc = html;
    frame.addEventListener("load", function onLoad(){
      loading.classList.remove("show");
      frame.removeEventListener("load", onLoad);
    });
    currentRoom = room;
    currentEj = ej;
    window.scrollTo(0, 0);
  }

  function route(){
    var p = parseHash();
    if (p.room !== currentRoom){
      loadRoom(p.room, p.ej);
    } else if (p.ej !== currentEj){
      // Solo cambió el ej dentro de la misma habitación.
      // No recargamos el iframe (perderíamos estado): solo actualizamos
      // nuestra referencia. El iframe ya gestiona su propio estado.
      currentEj = p.ej;
    }
  }

  // Recibimos avisos de los iframes (las habitaciones).
  window.addEventListener("message", function(e){
    var d = e.data;
    if (!d || typeof d !== "object" || !d.type) return;

    if (d.type === "miCasa.nav"){
      // Una habitacion pide cambiar de pagina (boton "El Recibidor",
      // "Volver al Vestibulo", etc.).
      var target = String(d.target || "");
      if (target && target.charAt(0) === "#" && target !== location.hash){
        location.hash = target;  // dispara hashchange -> route()
      }
    } else if (d.type === "miCasa.replaceEj"){
      // La habitacion ha avanzado de ejercicio internamente: sincronizamos
      // el hash sin recargar el iframe.
      var p = parseHash();
      var ej = d.ej;
      currentEj = ej;
      var newHash = ej ? ("#" + p.room + "?ej=" + ej) : ("#" + p.room);
      if (newHash !== location.hash){
        history.replaceState(null, "", location.pathname + location.search + newHash);
      }
    } else if (d.type === "miCasa.storage.set"){
      sharedState[d.key] = d.value;
      try { localStorage.setItem(d.key, d.value); } catch(_){}
    } else if (d.type === "miCasa.storage.remove"){
      delete sharedState[d.key];
      try { localStorage.removeItem(d.key); } catch(_){}
    } else if (d.type === "miCasa.storage.clear"){
      // Solo limpiamos las claves del taller, no todo el localStorage del padre.
      for (var k in sharedState){
        if (Object.prototype.hasOwnProperty.call(sharedState, k)){
          try { localStorage.removeItem(k); } catch(_){}
        }
      }
      sharedState = {};
    }
  });

  // Si no hay hash al entrar, vamos al vestíbulo.
  if (!location.hash){
    history.replaceState(null, "", location.pathname + location.search + "#vestibulo");
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
